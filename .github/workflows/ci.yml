name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/Retail25.sln

      - name: Build (warnings are errors)
        run: dotnet build backend/Retail25.sln --no-restore -c Release

      - name: Unit + architecture tests
        run: |
          dotnet test backend/tests/Retail25.Domain.UnitTests --no-build -c Release --logger trx
          dotnet test backend/tests/Retail25.Application.UnitTests --no-build -c Release --logger trx
          dotnet test backend/tests/Retail25.TerminalAgent.UnitTests --no-build -c Release --logger trx
          dotnet test backend/tests/Retail25.ArchitectureTests --no-build -c Release --logger trx

      - name: Integration tests (Testcontainers)
        run: dotnet test backend/tests/Retail25.IntegrationTests --no-build -c Release --logger trx

      # The integration suite skips itself when no Docker daemon is present, which is right on a
      # developer's machine and wrong here. Without this check the whole suite could quietly stop
      # running and the build would stay green — which is exactly how it came to be empty before.
      - name: Assert the integration suite actually ran
        run: |
          set -euo pipefail
          trx=$(find backend/tests/Retail25.IntegrationTests -name '*.trx' | head -1)
          if [ -z "$trx" ]; then echo "::error::no integration test results were produced"; exit 1; fi
          if grep -q 'outcome="NotExecuted"' "$trx"; then
            echo "::error::integration tests were skipped — the Docker daemon was not available"
            exit 1
          fi
          echo "Integration tests ran against a real container."

      - name: Vulnerable package scan
        run: dotnet list backend/Retail25.sln package --vulnerable --include-transitive

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true

  # The end-to-end suite proves things only a real browser can: chiefly doc 07's "no token is
  # reachable from JavaScript". It needs the whole stack, so it is a separate job rather than part
  # of the frontend one, and it is skipped unless the sign-in credentials are configured.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci-Sql-Password-1234!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Ci-Sql-Password-1234!\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=retail25;User Id=sa;******;TrustServerCertificate=True;MultipleActiveResultSets=True
      ConnectionStrings__Redis: localhost:6379
      Database__AutoMigrate: 'true'
      Database__Seed: 'true'
      OpenIddict__AllowInsecureHttp: 'true'
      Auth__AdminEmail: admin@retail25.local
      Auth__AdminPassword: ${{ secrets.E2E_ADMIN_PASSWORD || 'Ci-Password-1234!' }}
      Auth__WebOrigin: http://localhost:3000
      E2E_USERNAME: admin@retail25.local
      E2E_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'Ci-Password-1234!' }}
      API_URL: http://localhost:5000
      APP_ORIGIN: http://localhost:3000
      SESSION_SECRET: ci-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the API
        run: |
          dotnet run --project backend/src/Retail25.Api -c Release --no-launch-profile \
            --urls http://localhost:5000 &
          healthy=false
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/health/live; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "::error::API failed to become healthy"
            exit 1
          fi

      - name: Install the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # Phase 0's build list ends with "container publish". Building the images on every run is what
  # keeps the Dockerfiles honest — they were referenced only by compose before, so a change that
  # broke them would have gone unnoticed until someone tried to deploy. Images are pushed to GHCR
  # only from main; a pull request builds them and throws them away.
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: backend
            dockerfile: deploy/Dockerfile.api
          - image: web
            context: frontend
            dockerfile: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
